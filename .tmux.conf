set -g mouse on

set -g mode-keys vi
set -g allow-passthrough on

# change prefix key to C-a
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# set windows start number 1(defalut: 0)
set -g base-index 1
# set pane start number 1(default: 0)
set -g pane-base-index 1
# show windows
bind w choose-window
# show session
bind s choose-session

# Use hjkl to switch panes
bind h select-pane -L
bind l select-pane -R
bind k select-pane -U
bind j select-pane -D

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Split key
bind | split-window -h # split horizontal
bind - split-window -v # split vertical
# bind -n C-\\ split-window -h # split horizontal
# bind -n C-\_ split-window -v # split vertical

# 패널 크기 조정: Ctrl+Alt+h/j/k/l
bind-key -n C-M-Left resize-pane -L 1
bind-key -n C-M-Down resize-pane -D 1
bind-key -n C-M-Up resize-pane -U 1
bind-key -n C-M-Right resize-pane -R 1

# New Window
bind -n C-t new-window

# Ctrl arrow to switch windows
# Shift arrow to switch windows
bind -n C-Right next-window
bind -n C-Left previous-window

# change window order
bind -n C-S-Left swap-window -t -1
bind -n C-S-Right swap-window -t +1

# scrollback buffer size increase
set -g history-limit 100000

# toggle pane title visibility
bind T run 'zsh -c "arr=( off top ) && tmux setw pane-border-status \${arr[\$(( \${arr[(I)#{pane-border-status}]} % 2 + 1 ))]}"'
# send command to all panes
bind-key y set-window-option synchronize-panes

set -g status-position top 
set -g pane-border-status top
# set -g pane-border-lines heavy # single double heavy simple number 
set -g pane-border-lines single # single double heavy simple number 
set -g pane-border-indicators colour # colour awwors both
# set -g pane-border-format "┫ #{pane_index}.#{pane_current_command} ┣"
set -g pane-border-format " #{pane_index}.#{pane_current_command} "
# set -g @continuum-restore 'on'

# TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# set -g @plugin 'tmux-plugins/tmux-yank'
# tmux automatic restore
# set -g @plugin 'tmux-plugins/tmx-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# set -g @iconcolor-theme "pastel-cyan2,round,music-emoji,"
set -g @iconcolor-theme "mint,triangle,target,"
# set -g @iconcolor-theme "cold,wave,surf"
# set -g @iconcolor-theme "cold,wave,airplane"
# set -g @iconcolor-theme "flame,pixel,rocket"
# set -g @iconcolor-colors "green"
set -g @iconcolor-separators ""
set -g @iconcolor-icons "" 

set -g @iconcolor-show-session on
set -g @iconcolor-show-user on
set -g @iconcolor-show-pane on
set -g @iconcolor-show-time on
set -g @iconcolor-show-date on
set -g @iconcolor-show-cpu-mem on
set -g @iconcolor-show-battery on

set -g @iconcolor-user-format "#(whoami)@#H"
# set -g @iconcolor-user-format "#(whoami)"
set -g @iconcolor-time-format "%H:%M:%S"
set -g @iconcolor-date-format "%y/%m/%d"

set -g @plugin 'jpark6/tmux-iconcolor-status'
# run $HOME/Repos/tmux-iconcolor-status/iconcolor-status.tmux

set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
run '~/.tmux/plugins/tpm/tpm'
